<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Calorie Lens</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --bg:#fff8ef;
      --card:rgba(255,255,255,0.86);
      --card2:rgba(255,252,247,0.98);
      --border:rgba(236,124,31,0.24);
      --text:#2c1608;
      --muted:rgba(91,56,30,0.68);
      --orange:#f97316;
      --orange2:#ffb15c;
      --cream:#fffaf4;
      --bad:#dc2626;
      --shadow: 0 22px 54px rgba(202,111,28,0.18);
    }

    html,body{height:100%; background:
      radial-gradient(circle at 12% 8%, rgba(255,181,97,0.34) 0%, rgba(255,181,97,0) 32%),
      linear-gradient(180deg, #fffaf4 0%, #fff5e8 45%, #ffffff 100%);
      color:var(--text);}
    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background-attachment: fixed;}
    video{object-fit:cover;}
    *{-webkit-tap-highlight-color:transparent;}

    .safe-pt{padding-top:calc(env(safe-area-inset-top) + 12px);}
    .safe-pb{padding-bottom:calc(env(safe-area-inset-bottom) + 92px);}

    @keyframes scanLine {
      0%{ transform:translateY(-8%); opacity:.15; }
      50%{ opacity:.65; }
      100%{ transform:translateY(108%); opacity:.15; }
    }
    .scan-line{ animation:scanLine 2.1s linear infinite; }

    @keyframes chipIn {
      from{ opacity:0; transform:translateY(10px) scale(.96); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }
    .chip-in{ animation:chipIn .28s ease-out both; }

    @keyframes pulseSoft {
      0%,100%{ opacity:.4; }
      50%{ opacity:.8; }
    }
    .pulse-soft{ animation:pulseSoft 1.2s ease-in-out infinite; }

    .sheet{ transform:translateY(108%); transition:transform 220ms ease; }
    .sheet.open{ transform:translateY(0); }
    .press:active{ transform:scale(0.98); }
    .surface{
      border:1px solid var(--border);
      background:linear-gradient(150deg, rgba(255,255,255,0.96), rgba(255,238,218,0.82));
      box-shadow:0 18px 42px rgba(202,111,28,0.14);
    }
    .metric-card{
      border:1px solid rgba(236,124,31,0.18);
      background:rgba(255,255,255,0.78);
    }
    .item-pill{
      border:1px solid rgba(236,124,31,0.24);
      background:rgba(255,145,44,0.10);
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(249,115,22,0.08); }
    ::-webkit-scrollbar-thumb { background: rgba(249,115,22,0.28); border-radius: 999px; }

    .text-white,
    .text-white\/90,
    .text-white\/85,
    .text-white\/80{ color:rgba(44,22,8,0.88) !important; }
    .text-white\/65,
    .text-white\/60,
    .text-white\/55,
    .text-white\/45{ color:var(--muted) !important; }
    .border-white\/10{ border-color:rgba(236,124,31,0.18) !important; }
    .border-white\/12{ border-color:rgba(236,124,31,0.22) !important; }
    .bg-white\/10{ background-color:rgba(255,255,255,0.72) !important; }
    .bg-white\/5{ background-color:rgba(255,246,235,0.76) !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useEffect, useMemo, useRef, useState } = React;

    function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
    function round(n){ return Math.round(Number(n) || 0); }

    function confidenceLabel(c){
      const v = clamp(Number(c) || 0, 0, 1);
      if (v >= 0.8) return "High";
      if (v >= 0.55) return "Medium";
      return "Low";
    }

    function scoreColor(score){
      const s = Number(score) || 0;
      if (s >= 75) return "var(--orange2)";
      if (s >= 55) return "#f59e0b";
      return "var(--bad)";
    }

    function normalizeDishName(name){
      return String(name || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    async function analyzeFrameFromVideo(videoEl, previousDetectedDish){
      const w = videoEl.videoWidth;
      const h = videoEl.videoHeight;
      if (!w || !h) return null;

      const targetW = 720;
      const scale = targetW / w;
      const tw = Math.round(w * clamp(scale, 0.25, 1));
      const th = Math.round(h * clamp(scale, 0.25, 1));

      const canvas = document.createElement("canvas");
      canvas.width = tw;
      canvas.height = th;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoEl, 0, 0, tw, th);

      const base64 = canvas.toDataURL("image/jpeg", 0.72).split(",")[1];

      const res = await fetch("/api/analyze", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, previousDetectedDish })
      });

      let data = null;
      try { data = await res.json(); } catch { data = { error: "Non-JSON response from server" }; }

      return { ok: res.ok, status: res.status, data };
    }

    async function submitFeedback(result, wasAccurate){
      const res = await fetch("/api/feedback", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ result, wasAccurate })
      });

      let data = null;
      try { data = await res.json(); } catch { data = { error: "Non-JSON response from server" }; }

      return { ok: res.ok, status: res.status, data };
    }

    function App(){
      const videoRef = useRef(null);
      const streamRef = useRef(null);
      const inFlightRef = useRef(false);
      const lastCallRef = useRef(0);
      const detectedDishRef = useRef(null);
      const stableResultRef = useRef(null);
      const pendingInitialRef = useRef({ name: "", count: 0, data: null });
      const pendingSwitchRef = useRef({ name: "", count: 0, data: null });

      const [status, setStatus] = useState("idle");
      const [busy, setBusy] = useState(false);
      const [errorMsg, setErrorMsg] = useState("");
      const [sheetOpen, setSheetOpen] = useState(false);
      const [result, setResult] = useState(null);
      const [selectedItem, setSelectedItem] = useState(null);
      const [feedbackState, setFeedbackState] = useState({ status: "idle", value: null, message: "" });

      const items = useMemo(() => Array.isArray(result?.items) ? result.items : [], [result]);
      const total = useMemo(() => result?.total || { kcal:0, protein_g:0, carbs_g:0, fat_g:0 }, [result]);
      const balance = useMemo(() => result?.balance || { score:0, verdict:"-", summary:"", improve:[] }, [result]);
      const suggestions = useMemo(() => Array.isArray(result?.suggestions) ? result.suggestions : [], [result]);
      const detectedDish = useMemo(() => result?.detected_dish || null, [result]);
      const conf = useMemo(() => clamp(Number(result?.confidence)||0, 0, 1), [result]);
      useEffect(() => { detectedDishRef.current = detectedDish; }, [detectedDish]);
      useEffect(() => {
        setFeedbackState({ status: "idle", value: null, message: "" });
      }, [result]);

      const quickItems = useMemo(() => items.slice(0, 5), [items]);

      function getDishKey(data){
        if (!data) return "";
        return normalizeDishName(data?.detected_dish?.name || data?.items?.[0]?.name || "");
      }

      function confidenceOf(data){
        return clamp(Number(data?.detected_dish?.confidence ?? data?.confidence ?? 0), 0, 1);
      }

      function resetStabilityState(){
        stableResultRef.current = null;
        pendingInitialRef.current = { name: "", count: 0, data: null };
        pendingSwitchRef.current = { name: "", count: 0, data: null };
      }

      function commitStableResult(data){
        stableResultRef.current = data;
        setResult(data);
      }

      function handleStableResult(nextData){
        if (!nextData) return;

        const nextName = getDishKey(nextData);
        const nextConfidence = confidenceOf(nextData);
        const currentData = stableResultRef.current;
        const currentName = getDishKey(currentData);

        if (!currentData){
          const pending = pendingInitialRef.current;
          if (pending.name === nextName){
            pending.count += 1;
            pending.data = nextData;
          } else {
            pendingInitialRef.current = { name: nextName, count: 1, data: nextData };
          }

          const confirmed = pendingInitialRef.current;
          const enoughSamples = confirmed.count >= 2;
          const enoughConfidence = nextConfidence >= 0.45;

          if (enoughSamples && (enoughConfidence || confirmed.count >= 3)){
            commitStableResult(confirmed.data);
          }
          return;
        }

        if (!nextName || nextName === currentName){
          pendingSwitchRef.current = { name: "", count: 0, data: null };
          commitStableResult(nextData);
          return;
        }

        const pendingSwitch = pendingSwitchRef.current;
        if (pendingSwitch.name === nextName){
          pendingSwitch.count += 1;
          pendingSwitch.data = nextData;
        } else {
          pendingSwitchRef.current = { name: nextName, count: 1, data: nextData };
        }

        const candidate = pendingSwitchRef.current;
        const shouldSwitch =
          (candidate.count >= 3 && nextConfidence >= 0.55) ||
          (candidate.count >= 2 && nextConfidence >= 0.85);

        if (shouldSwitch){
          pendingSwitchRef.current = { name: "", count: 0, data: null };
          commitStableResult(candidate.data);
        }
      }

      async function startCamera(){
        setErrorMsg("");
        setResult(null);
        setSelectedItem(null);
        setSheetOpen(false);
        resetStabilityState();
        setStatus("starting");

        try {
          if (streamRef.current){
            streamRef.current.getTracks().forEach(t => t.stop());
            streamRef.current = null;
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 }
            },
            audio: false
          });

          streamRef.current = stream;
          const video = videoRef.current;
          video.srcObject = stream;
          video.playsInline = true;
          video.muted = true;

          await video.play();
          inFlightRef.current = false;
          lastCallRef.current = 0;
          resetStabilityState();

          setStatus("running");
        } catch (e) {
          setStatus("error");
          setErrorMsg(e?.message || "Camera access failed.");
        }
      }

      function stopCamera(){
        if (streamRef.current){
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setStatus("idle");
        setBusy(false);
        setSheetOpen(false);
        setResult(null);
        setSelectedItem(null);
        setErrorMsg("");
        inFlightRef.current = false;
        resetStabilityState();
      }

      function openItem(item){
        setSelectedItem(item || null);
        setSheetOpen(true);
      }

      async function handleFeedback(wasAccurate){
        if (!result || feedbackState.status === "saving") return;

        setFeedbackState({
          status: "saving",
          value: wasAccurate,
          message: "Saving your response..."
        });

        try {
          const resp = await submitFeedback(result, wasAccurate);
          if (!resp.ok) {
            setFeedbackState({
              status: "error",
              value: null,
              message: resp?.data?.error || `Could not save response (${resp.status})`
            });
            return;
          }

          setFeedbackState({
            status: "saved",
            value: wasAccurate,
            message: "Response saved."
          });
        } catch (err) {
          setFeedbackState({
            status: "error",
            value: null,
            message: "Response could not be saved."
          });
        }
      }

      useEffect(() => {
        let rafId = null;

        async function loop(){
          rafId = requestAnimationFrame(loop);

          if (status !== "running") return;
          if (!videoRef.current) return;
          if (sheetOpen) return;

          const now = performance.now();
          const MIN_INTERVAL_MS = 2500;
          if (now - lastCallRef.current < MIN_INTERVAL_MS) return;
          if (inFlightRef.current) return;

          inFlightRef.current = true;
          lastCallRef.current = now;
          setBusy(true);

          try {
            const resp = await analyzeFrameFromVideo(videoRef.current, detectedDishRef.current);
            if (!resp) return;

            if (!resp.ok){
              const msg = resp?.data?.error || `Analysis unavailable (${resp.status})`;
              setErrorMsg(msg);

              if (resp.status === 429){
                lastCallRef.current = performance.now() + 10000;
              }
              return;
            }

            if (resp.data?.error){
              setErrorMsg(resp.data.error);
              return;
            }

            setErrorMsg("");
            handleStableResult(resp.data);
          } catch (err) {
            setErrorMsg("Analysis is currently unavailable. Please try again.");
          } finally {
            setBusy(false);
            inFlightRef.current = false;
          }
        }

        rafId = requestAnimationFrame(loop);
        return () => { if (rafId) cancelAnimationFrame(rafId); };
      }, [status, sheetOpen]);

      useEffect(() => () => stopCamera(), []);

      return (
        React.createElement("div", { className: "min-h-screen safe-pt safe-pb" },
          React.createElement("div", { className: "max-w-md mx-auto px-4" },

            React.createElement("div", { className: "flex items-center justify-between mb-3" },
              React.createElement("div", null,
                React.createElement("div", { className: "text-xs text-gray-500" }, "Calorie Lens"),
                React.createElement("div", { className: "text-xl font-semibold tracking-tight" },
                  React.createElement("span", { style: { color: "var(--orange)" } }, "Live"),
                  " Food Vision"
                )
              ),
              null
            ),

            React.createElement("div", {
              className: "surface rounded-2xl p-4 mb-4"
            },
              React.createElement("div", { className: "flex items-start justify-between gap-3" },
                React.createElement("div", null,
                  React.createElement("div", { className: "text-sm font-semibold text-gray-900" },
                    status === "running" ? "Frame your meal" : "Get a nutrition estimate in one tap"
                  ),
                  React.createElement("div", { className: "mt-1 text-xs text-gray-500 leading-relaxed" },
                    result
                      ? "Your calories, macros, balance score, and meal suggestions are ready below."
                      : "Use good lighting and keep the full plate in view for the best estimate."
                  )
                ),
                status !== "running"
                  ? React.createElement("button", {
                      onClick: startCamera,
                      className: "press shrink-0 px-4 py-2 rounded-2xl font-semibold text-white text-sm",
                      style: { background: "linear-gradient(135deg, var(--orange), var(--orange2))" }
                    }, "Scan")
                  : React.createElement("button", {
                      onClick: stopCamera,
                      className: "press shrink-0 px-4 py-2 rounded-2xl font-semibold text-gray-900 text-sm border border-gray-200 bg-gray-100"
                    }, "End")
              ),
              errorMsg ? React.createElement("div", { className: "mt-3 text-sm text-red-500" }, errorMsg) : null
            ),

            React.createElement("div", {
              className: "relative overflow-hidden rounded-3xl border mb-4",
              style: { borderColor: "rgba(236,124,31,0.28)", background: "linear-gradient(180deg, #fff7ed, #ffedd5)", aspectRatio: "3/4", boxShadow: "var(--shadow)" }
            },
              React.createElement("video", {
                ref: videoRef,
                className: "absolute inset-0 w-full h-full",
                playsInline: true,
                muted: true
              }),

              status === "running"
                ? React.createElement("div", {
                    className: "scan-line absolute left-0 right-0 h-12",
                    style: { background: "linear-gradient(to bottom, rgba(249,115,22,0), rgba(249,115,22,.34), rgba(249,115,22,0))" }
                  })
                : null,

              React.createElement("div", { className: "absolute top-3 left-3 right-3 flex items-center justify-between gap-2" },
                React.createElement("div", {
                  className: "px-3 py-1.5 rounded-2xl text-xs border",
                  style: { background: "rgba(255,255,255,0.86)", borderColor: "rgba(236,124,31,0.24)", color: "var(--text)" }
                },
                  status === "running" ? (busy ? "Analyzing meal" : "Camera active") : "Camera preview"
                ),
                React.createElement("div", {
                  className: "px-3 py-1.5 rounded-2xl text-xs border",
                  style: { background: "rgba(255,247,237,0.88)", borderColor: "rgba(236,124,31,0.34)", color: "var(--orange)" }
                },
                  result ? `${confidenceLabel(conf)} confidence` : "Ready"
                )
              ),

              React.createElement("div", {
                className: "absolute inset-x-0 bottom-0 p-3",
                style: { background: "linear-gradient(to top, rgba(255,247,237,0.94), rgba(255,247,237,0))" }
              },
                !result
                  ? React.createElement("div", {
                      className: "rounded-2xl p-4 border",
                      style: { background: "rgba(255,255,255,0.88)", borderColor: "rgba(236,124,31,0.22)" }
                    },
                      React.createElement("div", { className: "text-sm text-gray-800" },
                        status === "running"
                          ? React.createElement("span", { className: "pulse-soft" }, "Building your nutrition estimate")
                          : "Ready to scan"
                      ),
                      React.createElement("div", { className: "mt-1 text-xs text-gray-500" },
                        "Keep the full plate in frame for a more reliable result."
                      )
                    )
                  : React.createElement("div", {
                      className: "rounded-2xl p-4 border",
                      style: { background: "rgba(255,255,255,0.9)", borderColor: "rgba(236,124,31,0.24)" }
                    },
                      React.createElement("div", { className: "flex items-start justify-between gap-3" },
                        React.createElement("div", null,
                          React.createElement("div", { className: "text-xs text-gray-500" }, "Nutrition estimate"),
                          detectedDish
                            ? React.createElement("div", { className: "mt-0.5 text-xs", style: { color: "var(--orange2)" } },
                                `${detectedDish.name} • ${detectedDish.cuisine}`
                              )
                            : null,
                          React.createElement("div", { className: "text-3xl font-bold leading-none" },
                            React.createElement("span", { style: { color: "var(--orange)" } }, round(total.kcal)),
                            React.createElement("span", { className: "text-base font-semibold text-gray-700 ml-1" }, "kcal")
                          ),
                          React.createElement("div", { className: "mt-1 text-xs text-gray-500" },
                            `${round(total.protein_g)}g P  |  ${round(total.carbs_g)}g C  |  ${round(total.fat_g)}g F`
                          )
                        ),
                        React.createElement("button", {
                          onClick: () => openItem(null),
                          className: "press px-3 py-2 rounded-2xl text-xs font-semibold text-white",
                          style: { background: "linear-gradient(135deg, var(--orange), var(--orange2))" }
                        }, "Review meal")
                      ),

                      React.createElement("div", { className: "mt-3 flex flex-wrap gap-2" },
                        quickItems.length === 0
                          ? React.createElement("span", { className: "text-xs text-gray-500" }, "No food identified yet")
                          : quickItems.map((it, i) => (
                              React.createElement("button", {
                                key: `${it.name}-${i}`,
                                onClick: () => openItem(it),
                                className: "chip-in press px-2.5 py-1.5 rounded-2xl text-xs border",
                                style: {
                                  background: "rgba(249,115,22,0.10)",
                                  borderColor: "rgba(236,124,31,0.28)",
                                  animationDelay: `${i * 60}ms`
                                }
                              }, `${it.name} (${round(it.kcal)} kcal)`)
                            ))
                      )
                    )
              )
            )
            ,

            result
              ? React.createElement("div", { className: "space-y-3 mb-5" },
                  React.createElement("div", { className: "surface rounded-2xl p-4" },
                    React.createElement("div", { className: "flex items-start justify-between gap-3" },
                      React.createElement("div", null,
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Nutrition estimate"),
                        React.createElement("div", { className: "mt-0.5 text-lg font-semibold leading-tight" },
                          detectedDish ? detectedDish.name : "Meal identified"
                        ),
                        detectedDish
                          ? React.createElement("div", { className: "text-xs mt-1", style: { color: "var(--orange2)" } },
                              `${detectedDish.cuisine || "Food"} / ${confidenceLabel(conf)} confidence`
                            )
                          : null
                      ),
                      React.createElement("button", {
                        onClick: () => openItem(null),
                        className: "press shrink-0 px-3 py-2 rounded-2xl text-xs font-semibold text-white",
                        style: { background: "linear-gradient(135deg, var(--orange), var(--orange2))" }
                      }, "Review")
                    ),

                    React.createElement("div", { className: "grid grid-cols-4 gap-2 mt-4" },
                      React.createElement("div", { className: "metric-card rounded-2xl p-3 col-span-2" },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Calories"),
                        React.createElement("div", { className: "mt-1 text-2xl font-bold leading-none", style: { color: "var(--orange)" } },
                          round(total.kcal)
                        ),
                        React.createElement("div", { className: "mt-1 text-xs text-gray-500" }, "kcal")
                      ),
                      React.createElement("div", { className: "metric-card rounded-2xl p-3" },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Protein"),
                        React.createElement("div", { className: "mt-1 text-lg font-semibold" }, `${round(total.protein_g)}g`)
                      ),
                      React.createElement("div", { className: "metric-card rounded-2xl p-3" },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Carbs"),
                        React.createElement("div", { className: "mt-1 text-lg font-semibold" }, `${round(total.carbs_g)}g`)
                      ),
                      React.createElement("div", { className: "metric-card rounded-2xl p-3 col-span-2" },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Fat"),
                        React.createElement("div", { className: "mt-1 text-lg font-semibold" }, `${round(total.fat_g)}g`)
                      ),
                      React.createElement("div", { className: "metric-card rounded-2xl p-3 col-span-2" },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Balance"),
                        React.createElement("div", { className: "mt-1 text-lg font-semibold", style: { color: scoreColor(balance.score) } },
                          `${round(balance.score)}/100`
                        )
                      )
                    )
                  ),

                  quickItems.length
                    ? React.createElement("div", { className: "surface rounded-2xl p-4" },
                        React.createElement("div", { className: "flex items-center justify-between gap-3 mb-2" },
                          React.createElement("div", { className: "text-sm font-semibold" }, "Items detected"),
                          React.createElement("div", { className: "text-xs text-gray-500" }, "Open any item")
                        ),
                        React.createElement("div", { className: "space-y-2" },
                          quickItems.map((it, i) => (
                            React.createElement("button", {
                              key: `${it.name}-row-${i}`,
                              onClick: () => openItem(it),
                              className: "press item-pill w-full rounded-2xl px-3 py-2.5 text-left flex items-center justify-between gap-3"
                            },
                              React.createElement("div", { className: "min-w-0" },
                                React.createElement("div", { className: "text-sm font-semibold truncate" }, it.name),
                                React.createElement("div", { className: "text-xs text-gray-500 truncate" }, it.portion || "Estimated portion")
                              ),
                              React.createElement("div", { className: "text-sm font-semibold shrink-0", style: { color: "var(--orange2)" } },
                                `${round(it.kcal)} kcal`
                              )
                            )
                          ))
                        )
                      )
                    : null,

                  React.createElement("div", { className: "surface rounded-2xl p-4" },
                    React.createElement("div", { className: "flex items-start justify-between gap-3" },
                      React.createElement("div", null,
                        React.createElement("div", { className: "text-sm font-semibold" }, balance.verdict || "Meal quality"),
                        React.createElement("div", { className: "text-xs text-gray-500 mt-1 leading-relaxed" }, balance.summary || "Your meal quality summary will appear after scanning.")
                      ),
                      React.createElement("div", {
                        className: "px-2.5 py-1 rounded-2xl text-xs font-semibold",
                        style: { background: "rgba(249,115,22,0.10)", color: scoreColor(balance.score) }
                      }, `${round(balance.score)}/100`)
                    ),
                    Array.isArray(balance.improve) && balance.improve.length
                      ? React.createElement("div", { className: "mt-3 flex flex-wrap gap-2" },
                          balance.improve.slice(0, 3).map((tip, i) => (
                            React.createElement("div", {
                              key: `tip-${i}`,
                              className: "rounded-2xl px-3 py-2 text-xs leading-relaxed border border-gray-200 bg-gray-50"
                            }, tip)
                          ))
                        )
                      : null
                  ),

                  suggestions.length || result
                    ? React.createElement("div", { className: "surface rounded-2xl p-4" },
                        suggestions.length
                          ? React.createElement("div", null,
                              React.createElement("div", { className: "text-sm font-semibold mb-2" }, "Suggested improvement"),
                              React.createElement("div", { className: "rounded-2xl p-3 border border-gray-200 bg-gray-50" },
                                React.createElement("div", { className: "text-xs", style: { color: "var(--orange2)" } },
                                  suggestions[0]?.goal || "Balanced meal"
                                ),
                                React.createElement("div", { className: "text-sm text-gray-800 mt-1" }, suggestions[0]?.add || ""),
                                suggestions[0]?.why
                                  ? React.createElement("div", { className: "text-xs text-gray-500 mt-1" }, suggestions[0].why)
                                  : null
                              )
                            )
                          : null,
                        React.createElement("div", { className: suggestions.length ? "mt-4 pt-4 border-t border-gray-200" : "" },
                          React.createElement("div", { className: "flex items-center justify-between gap-3" },
                            React.createElement("div", null,
                              React.createElement("div", { className: "text-sm font-semibold" }, "How accurate was this?"),
                              React.createElement("div", { className: "text-xs text-gray-500 mt-0.5" }, "Your response helps improve scan quality.")
                            ),
                            React.createElement("div", { className: "flex gap-2 shrink-0" },
                              React.createElement("button", {
                                onClick: () => handleFeedback(true),
                                disabled: feedbackState.status === "saving" || feedbackState.status === "saved",
                                className: "press px-3 py-2 rounded-2xl text-sm font-semibold text-white disabled:opacity-60",
                                style: {
                                  background: feedbackState.value === true && feedbackState.status === "saved"
                                    ? "linear-gradient(135deg, var(--orange), var(--orange2))"
                                    : "linear-gradient(135deg, var(--orange), var(--orange2))"
                                }
                              }, "Yes"),
                              React.createElement("button", {
                                onClick: () => handleFeedback(false),
                                disabled: feedbackState.status === "saving" || feedbackState.status === "saved",
                                className: "press px-3 py-2 rounded-2xl text-sm font-semibold text-gray-900 disabled:opacity-60",
                                style: {
                                  background: feedbackState.value === false && feedbackState.status === "saved"
                                    ? "rgba(220,38,38,0.12)"
                                    : "rgba(255,255,255,0.78)",
                                  border: "1px solid rgba(236,124,31,0.2)"
                                }
                              }, "No")
                            )
                          ),
                          feedbackState.message
                            ? React.createElement("div", {
                                className: "mt-2 text-xs",
                                style: { color: feedbackState.status === "error" ? "var(--bad)" : "var(--muted)" }
                              }, feedbackState.message)
                            : null
                        )
                      )
                    : null
                )
              : null
          ),

          React.createElement("div", {
            className: "fixed inset-x-0 z-40 px-4",
            style: { bottom: "calc(env(safe-area-inset-bottom) + 14px)" }
          },
            React.createElement("div", { className: "max-w-md mx-auto" },
              status !== "running"
                ? React.createElement("button", {
                    onClick: startCamera,
                    className: "press w-full py-3.5 rounded-2xl font-semibold text-white text-base",
                    style: {
                      background: "linear-gradient(135deg, var(--orange), var(--orange2))",
                      boxShadow: "0 14px 32px rgba(249,115,22,0.26)"
                    }
                  }, "Start scanning")
                : React.createElement("button", {
                    onClick: stopCamera,
                    className: "press w-full py-3.5 rounded-2xl font-semibold text-gray-900 text-base",
                    style: {
                      background: "rgba(249,115,22,0.12)",
                      border: "1px solid rgba(236,124,31,0.34)",
                      boxShadow: "0 10px 24px rgba(202,111,28,0.14)"
                    }
                  }, "End scan")
            )
          ),

          React.createElement("div", {
            onClick: (e) => { if (e.target?.dataset?.overlay === "1") setSheetOpen(false); },
            "data-overlay": "1",
            className: "fixed inset-0 z-50",
            style: { display: sheetOpen ? "block" : "none", background: "rgba(44,22,8,0.24)" }
          },
            React.createElement("div", { className: "absolute inset-x-0 bottom-0 sheet open" },
              React.createElement("div", {
                className: "rounded-t-3xl border px-4 pt-3 pb-4 max-h-[80vh] overflow-auto",
                style: { background: "var(--card2)", borderColor: "rgba(236,124,31,0.18)" }
              },
                React.createElement("div", { className: "flex items-center justify-between" },
                  React.createElement("div", null,
                    React.createElement("div", { className: "text-sm font-semibold" }, selectedItem ? selectedItem.name : "Meal review"),
                    React.createElement("div", { className: "text-xs text-gray-500 mt-0.5" },
                      selectedItem ? (selectedItem.portion || "Estimated portion") : "Nutrition, balance, and suggestions"
                    )
                  ),
                  React.createElement("button", {
                    onClick: () => setSheetOpen(false),
                    className: "press px-3 py-2 rounded-2xl bg-gray-100 border border-gray-200 text-sm"
                  }, "Done")
                ),

                selectedItem
                  ? React.createElement("div", { className: "mt-3 space-y-3" },
                      React.createElement("div", {
                        className: "rounded-2xl p-3 border",
                        style: { background: "var(--card)", borderColor: "rgba(236,124,31,0.18)" }
                      },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Nutrition estimate"),
                        React.createElement("div", { className: "mt-1 text-xl font-semibold", style: { color: "var(--orange2)" } }, `${round(selectedItem.kcal)} kcal`),
                        React.createElement("div", { className: "text-sm text-gray-700 mt-1" },
                          `${round(selectedItem.protein_g)}g protein | ${round(selectedItem.carbs_g)}g carbs | ${round(selectedItem.fat_g)}g fat`
                        ),
                        React.createElement("div", { className: "text-xs text-gray-500 mt-2" },
                          `Confidence: ${round((Number(selectedItem.confidence)||0)*100)}%`
                        ),
                        React.createElement("div", { className: "text-sm text-gray-800 mt-2" }, selectedItem.why || "")
                      )
                    )
                  : null,

                React.createElement("div", { className: "mt-3" },
                  detectedDish
                    ? React.createElement("div", {
                        className: "rounded-2xl p-3 border mb-3",
                        style: { background: "var(--card)", borderColor: "rgba(236,124,31,0.18)" }
                      },
                        React.createElement("div", { className: "text-xs text-gray-500" }, "Dish identified"),
                        React.createElement("div", { className: "mt-1 text-lg font-semibold", style: { color: "var(--orange2)" } },
                          `${detectedDish.name} (${detectedDish.cuisine})`
                        ),
                        Array.isArray(detectedDish.alternatives) && detectedDish.alternatives.length
                          ? React.createElement("div", { className: "mt-1 text-xs text-gray-500" },
                              `Also possible: ${detectedDish.alternatives.join(", ")}`
                            )
                          : null
                      )
                    : null,
                  React.createElement("div", {
                    className: "rounded-2xl p-3 border",
                    style: { background: "var(--card)", borderColor: "rgba(236,124,31,0.18)" }
                  },
                    React.createElement("div", { className: "text-xs text-gray-500" }, "Meal quality score"),
                    React.createElement("div", { className: "mt-1 text-2xl font-bold", style: { color: scoreColor(balance.score) } },
                      `${round(balance.score)}/100  ${balance.verdict || ""}`
                    ),
                    React.createElement("div", { className: "text-sm text-gray-700 mt-1" }, balance.summary || "")
                  )
                ),

                React.createElement("div", { className: "mt-3" },
                  React.createElement("div", { className: "text-sm font-semibold mb-2" }, "Improve this meal"),
                  Array.isArray(balance.improve) && balance.improve.length
                    ? React.createElement("div", { className: "space-y-2" },
                        balance.improve.map((tip, i) => (
                          React.createElement("div", {
                            key: i,
                            className: "rounded-2xl p-3 border text-sm",
                            style: { background: "rgba(255,246,235,0.78)", borderColor: "rgba(236,124,31,0.18)" }
                          }, tip)
                        ))
                      )
                    : React.createElement("div", { className: "text-sm text-gray-500" }, "No extra improvements available.")
                ),

                React.createElement("div", { className: "mt-3" },
                  React.createElement("div", { className: "text-sm font-semibold mb-2" }, "Nutrition suggestions"),
                  suggestions.length
                    ? React.createElement("div", { className: "space-y-2" },
                        suggestions.map((s, i) => (
                          React.createElement("div", {
                            key: i,
                            className: "rounded-2xl p-3 border",
                            style: { background: "rgba(255,246,235,0.78)", borderColor: "rgba(236,124,31,0.18)" }
                          },
                            React.createElement("div", { className: "text-xs", style: { color: "var(--orange2)" } }, s.goal || "Balanced meal"),
                            React.createElement("div", { className: "text-sm text-gray-800 mt-1" }, s.add || ""),
                            s.replace ? React.createElement("div", { className: "text-xs text-gray-500 mt-1" }, `Swap: ${s.replace}`) : null,
                            s.why ? React.createElement("div", { className: "text-xs text-gray-500 mt-1" }, s.why) : null
                          )
                        ))
                      )
                    : React.createElement("div", { className: "text-sm text-gray-500" }, "No suggestions available.")
                ),

                !selectedItem && result
                  ? React.createElement("div", { className: "mt-3" },
                      React.createElement("div", {
                        className: "rounded-2xl p-3 border",
                        style: { background: "rgba(255,246,235,0.78)", borderColor: "rgba(236,124,31,0.18)" }
                      },
                        React.createElement("div", { className: "text-sm font-semibold" }, "How accurate was this?"),
                        React.createElement("div", { className: "text-xs text-gray-500 mt-1" },
                          "Your response helps improve scan quality."
                        ),
                        React.createElement("div", { className: "mt-3 flex gap-2" },
                          React.createElement("button", {
                            onClick: () => handleFeedback(true),
                            disabled: feedbackState.status === "saving" || feedbackState.status === "saved",
                            className: "press flex-1 py-2.5 rounded-2xl text-sm font-semibold text-white disabled:opacity-60",
                            style: {
                              background: feedbackState.value === true && feedbackState.status === "saved"
                                ? "linear-gradient(135deg, var(--orange), var(--orange2))"
                                : "linear-gradient(135deg, var(--orange), var(--orange2))"
                            }
                          }, "Yes"),
                          React.createElement("button", {
                            onClick: () => handleFeedback(false),
                            disabled: feedbackState.status === "saving" || feedbackState.status === "saved",
                            className: "press flex-1 py-2.5 rounded-2xl text-sm font-semibold text-gray-900 disabled:opacity-60",
                            style: {
                              background: feedbackState.value === false && feedbackState.status === "saved"
                                ? "rgba(220,38,38,0.12)"
                                : "rgba(255,255,255,0.78)",
                              border: "1px solid rgba(236,124,31,0.2)"
                            }
                          }, "No")
                        ),
                        feedbackState.message
                          ? React.createElement("div", {
                              className: "mt-2 text-xs",
                              style: { color: feedbackState.status === "error" ? "var(--bad)" : "var(--muted)" }
                            }, feedbackState.message)
                          : null
                      )
                    )
                  : null,

                React.createElement("div", { className: "mt-4 text-xs text-gray-400" },
                  "Nutrition estimates can vary by portion size, ingredients, and preparation method."
                )
              )
            )
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
  </script>
</body>
</html>
